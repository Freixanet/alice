name: alice
version: 1.0.0
description: "Connects the Alice iPhone app to this Hermes. Adds an Alice tab to the dashboard that shows a one-time pairing QR code, lets Alice read and edit each profile's curated memory and notes, and keeps the Business team talking only among itself (a pre_tool_call hook on message_agent). No tools, commands or changes to Hermes' own code, so Hermes updates never collide with it."
provides_hooks:
  - pre_tool_call
author: Freixanet
kind: standalone
