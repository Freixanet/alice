name: Bug report
description: Report a reproducible problem in Alice
body:
  - type: markdown
    attributes:
      value: Please remove keys, pairing QR codes and private conversations. Report security issues through the private link in SECURITY.md.
  - type: dropdown
    id: surface
    attributes:
      label: Where did this happen?
      options:
        - iPhone / iPad
        - Web
        - Hermes dashboard plugin
        - Mac notifier
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected behavior and actual behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Alice build, OS and Hermes version
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or sanitized diagnostics
