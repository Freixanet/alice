name: RDC recovery

on:
  push:
    branches: [ops/rdc-recovery-20260910]

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Restart Remote Desktop Commander agent with Node 24
        shell: bash
        run: |
          set -euo pipefail
          echo "host=$(hostname)"
          echo "node=$(node --version)"
          echo "npx=$(command -v npx)"
          mkdir -p "$HOME/.desktop-commander"

          PIDS="$(ps ax -o pid=,command= | awk '/[d]esktop-commander/ && / remote( |$)/ {print $1}' | tr '\n' ' ')"
          if [ -n "${PIDS// }" ]; then
            echo "Stopping stale remote agent PIDs: $PIDS"
            kill $PIDS 2>/dev/null || true
            sleep 2
          fi

          LOG="$HOME/.desktop-commander/remote-recovery.log"
          PIDFILE="$HOME/.desktop-commander/remote-recovery.pid"
          : > "$LOG"
          export RUNNER_TRACKING_ID=""
          nohup npx -y @wonderwhy-er/desktop-commander@0.2.48 remote >"$LOG" 2>&1 < /dev/null &
          AGENT_PID=$!
          echo "$AGENT_PID" > "$PIDFILE"
          echo "Started candidate agent PID: $AGENT_PID"

          sleep 20
          echo "Desktop Commander processes after restart:"
          ps ax -o pid=,ppid=,etime=,stat=,command= | grep '[d]esktop-commander' || true
          echo "Agent log:"
          tail -n 160 "$LOG" || true
