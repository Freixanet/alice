name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # A self-hosted runner can read the host it runs on. Never execute a PR
    # authored by another account on this personal Mac.
    if: github.event_name != 'pull_request' || github.actor == github.repository_owner
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Was the gitleaks container. The runner is a Mac now, where Docker is
      # not always running, and the binary is the same scanner without that
      # dependency. The version is printed so every run records which scanner
      # judged it.
      - name: Secret scan
        run: |
          gitleaks version
          gitleaks detect --source=. --no-banner --redact
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run check:static
      - run: npm run security:check
      - run: npm run deps:check
      # bundles:check reads .vercel/output/static/assets, so it needs the build.
      - run: npm run build
      - run: npm run bundles:check
      - name: Test Hermes plugin and Mac notifier
        run: |
          set -euo pipefail
          HERMES_TEST_PYTHON="$HOME/.hermes/hermes-agent/venv/bin/python"
          test -x "$HERMES_TEST_PYTHON"
          "$HERMES_TEST_PYTHON" -m unittest discover -s hermes-plugin/tests
          "$HERMES_TEST_PYTHON" -m unittest discover -s mac/notifier

  browser:
    if: github.event_name != 'pull_request' || github.actor == github.repository_owner
    runs-on: [self-hosted, macOS]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --global npm@11.19.0
      - run: npm ci
      # `--with-deps` installs apt packages and this is macOS; the browsers
      # themselves install the same way.
      - run: npx playwright install chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  ios:
    if: github.event_name != 'pull_request' || github.actor == github.repository_owner
    runs-on: [self-hosted, macOS]
    # A cold simulator plus the full UI suite exceeds the old build-only budget.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Build and test native app
        run: bash scripts/verify-ios.sh all
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: ios-test-results
          path: ios/.build/DerivedData/Logs/Test
          retention-days: 14
