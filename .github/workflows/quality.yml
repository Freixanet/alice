name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source=/repo --no-banner --redact
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:static
      - run: npm run security:check
      - run: npm run deps:check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  ios:
    # Pull requests only. GitHub bills macOS at ten times the Linux rate, so
    # this one job costs more than the rest of the workflow put together —
    # around two hours of quota per run once Xcode, a brew install and the
    # tests are counted. Running it again on the push that merges the very
    # commit it just passed on buys nothing, and thirteen pushes in a night
    # empty a month's allowance.
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build iOS app
        run: >-
          xcodebuild
          -project ios/Alice.xcodeproj
          -scheme Alice
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Run iOS unit tests
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, rows in devices.items():
              if "iOS-26" not in runtime:
                  continue
              for row in rows:
                  if row.get("isAvailable") and row.get("name", "").startswith("iPhone"):
                      print(row["udid"])
                      raise SystemExit
          raise SystemExit("No available iOS 26 iPhone simulator")
          ')"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild \
            -project ios/Alice.xcodeproj \
            -scheme Alice \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
