name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # A self-hosted runner can read the host it runs on. Never execute a PR
    # authored by another account on this personal Mac.
    if: github.event_name != 'pull_request' || github.actor == github.repository_owner
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Was the gitleaks container. The runner is a Mac now, where Docker is
      # not always running, and the binary is the same scanner without that
      # dependency. The version is printed so every run records which scanner
      # judged it.
      - name: Secret scan
        run: |
          gitleaks version
          gitleaks detect --source=. --no-banner --redact
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:static
      - run: npm run security:check
      - run: npm run deps:check

  browser:
    if: github.event_name != 'pull_request' || github.actor == github.repository_owner
    runs-on: [self-hosted, macOS]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `--with-deps` installs apt packages and this is macOS; the browsers
      # themselves install the same way.
      - run: npx playwright install chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  ios:
    if: github.event_name != 'pull_request' || github.actor == github.repository_owner
    # This was pull-requests-only because GitHub bills macOS at ten times the
    # Linux rate: one run cost more than the rest of the workflow together, and
    # thirteen pushes in a night emptied a month's allowance. A self-hosted
    # runner is not billed, and work here lands by pushing straight to main —
    # so the restriction meant the iOS job had stopped running at all. Both
    # events now.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate Xcode project
        run: cd ios && xcodegen generate
      - name: Build iOS app
        run: >-
          xcodebuild
          -project ios/Alice.xcodeproj
          -scheme Alice
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Run iOS unit tests
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, rows in devices.items():
              if "iOS-26" not in runtime:
                  continue
              for row in rows:
                  if row.get("isAvailable") and row.get("name", "").startswith("iPhone"):
                      print(row["udid"])
                      raise SystemExit
          raise SystemExit("No available iOS 26 iPhone simulator")
          ')"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild \
            -project ios/Alice.xcodeproj \
            -scheme Alice \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
