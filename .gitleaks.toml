# Secret scanning, with one verified exception.
#
# `useDefault` keeps every rule gitleaks ships; this file only adds to them.

[extend]
useDefault = true

[[allowlists]]
description = "Verified non-secrets"

# scripts/pairing-hermes-config.test.mjs — deleted in eaca12a, still in the
# history gitleaks scans. It wrote a synthetic .env into a temporary HOME and
# asserted the parser read it back, so the 16-character API_SERVER_KEY in it is
# a fixture. Checked rather than assumed: its SHA-256 does not match the
# API_SERVER_KEY on this machine, so nothing here needs rotating. The realistic
# tailnet address beside it is what made this worth verifying.
#
# Scoped to that one path so a real leak anywhere else still fails the scan.
paths = ['''scripts/pairing-hermes-config\.test\.mjs''']

# ios/AliceTests/ActivityStackingTests.swift — added in beea60f. The
# generic-api-key rule reads `key: "default/job1"` as a credential because of
# the argument's name; it is a routine identifier, `<profile>/<job id>`, the
# shape `EventDigest.key(for:)` builds. Checked rather than assumed: its SHA-256
# matches no KEY/TOKEN/SECRET in the Hermes .env files on this machine.
#
# Allowed by exact value, not by path. A path-scoped entry with
# `condition = "AND"` was tried first and probed: a random ghp_ token and a
# random api_key placed in that file passed the scan, while the same values
# in any other file failed it — the path alone was enough. Matching only this
# literal keeps every real credential, in every file, failing the scan.
[[allowlists]]
description = "Routine identifier in activity stacking tests"
regexes = ['''^default/job1$''']

# A literal synthetic input for testing the 32-character production requirement.
# Exact-value exception; the file and real credentials remain scanned.
[[allowlists]]
description = "Production configuration test fixture (not a credential)"
regexes = ['''^test-fixture-secret-with-32-characters$''']

# This is a profile/routine identifier in a muted-report fixture, not a key.
[[allowlists]]
description = "Routine identifier in muted-report test"
regexes = ['''^chollometro/abc123$''']

# These are profile/routine identifiers in receipt tests, never credentials.
[[allowlists]]
description = "Routine identifiers in reaction receipt tests"
regexes = ['''^default/cffca6f34c20$''', '''^inbox/cffca6f34c20$''']

# A routine identifier (`routineKey`) in activity record tests, not a key.
[[allowlists]]
description = "Routine identifier in activity record tests"
regexes = ['''^default/morning$''']
