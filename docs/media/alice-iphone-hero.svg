      A native companion for Hermes.
    </text>
  </g>
  <path d="M90 547h642" stroke="#C5CABC" stroke-width="2" />
  <g font-family="Arial, sans-serif" font-size="25" fill="#414B3C">
    <text x="90" y="604">Conversations.</text>
    <text x="317" y="604">Visible work.</text>
    <text x="517" y="604">Your decisions.</text>
  </g>
  <g transform="translate(968 84) rotate(7 151 291)">
