      Alice
    </text>
    <text x="88" y="278" font-family="Georgia, serif" font-size="88">
      Your own agent.
    </text>
    <text x="88" y="382" font-family="Georgia, serif" font-size="88">
      On your iPhone.
    </text>
    <text
      x="91"
      y="462"
      font-family="Arial, sans-serif"
      font-size="31"
      fill="#56604F"
