<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1440"
  height="760"
  viewBox="0 0 1440 760"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Alice — your own agent, on your iPhone</title>
  <desc id="desc">
    An editorial illustration of a phone bearing the Alice name, linked to three
    simple nodes. Warm paper, charcoal and sage shapes express a calm native
    companion for your own Hermes agent. This is a conceptual product
    illustration.
  </desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1">
      <stop stop-color="#F8F5EF" />
      <stop offset="1" stop-color="#E9E7DC" />
    </linearGradient>
    <linearGradient id="phone" x2="1" y2="1">
      <stop stop-color="#363C35" />
      <stop offset="1" stop-color="#141914" />
    </linearGradient>
  </defs>
  <rect width="1440" height="760" rx="28" fill="url(#paper)" />
  <circle cx="1120" cy="375" r="290" fill="#D9DFCF" />
  <circle
    cx="1120"
    cy="375"
    r="239"
    fill="none"
    stroke="#B9C4AE"
    stroke-width="1.5"
  />
  <circle
    cx="1120"
    cy="375"
    r="325"
    fill="none"
    stroke="#CDD2C3"
    stroke-width="1.5"
  />
  <g fill="#1C241D">
