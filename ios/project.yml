name: Alice
options:
  bundleIdPrefix: com.freixanet
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  knownRegions: [en, es, Base]
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2DYYWXP5XL

targets:
  Alice:
    type: application
    platform: iOS
    sources:
      - path: Alice
    info:
      path: Alice/Info.plist
      properties:
        CFBundleDisplayName: Alice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - en
          - es
        AliceSourceRevision: $(ALICE_SOURCE_REVISION)
        # The pairing QR is an alice:// deep link; the scheme is what lets the
        # iPhone's own Camera app open Alice at the moment of pairing.
        CFBundleURLTypes:
          - CFBundleURLName: com.freixanet.alice.pairing
            CFBundleURLSchemes:
              - alice
        # Alice sends a window of upcoming events to the person's
        # own Hermes so agents can plan with them. Asked for in the chat, only
        # when a request needs it (CalendarSync).
        NSCalendarsFullAccessUsageDescription: Alice reads your upcoming events and shares them with your own Hermes, so your agents can plan around your day. She adds an event only when you tap Add, and never changes or deletes one.
        NSRemindersFullAccessUsageDescription: Alice shows your open reminders next to your events in Agenda, and shares the ones due soon (title, date and list, never notes) with your own Hermes for your morning briefing. She marks one done only when you tick it.
        NSLocationWhenInUseUsageDescription: Alice finds the places you ask her about, like "when I get to the supermarket", on the map near you.
        NSLocationAlwaysAndWhenInUseUsageDescription: So Alice can do what you asked when you arrive at or leave a place, even with the app closed. Your iPhone watches only those places; your location is never sent anywhere, only that you arrived or left.
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
        # The app's own background and logo, so opening it is not a white
        # flash before a warm off-white one. RootView fades the same logo out.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
        # Opportunistic background catch-up. iOS decides whether and when this
        # runs; Alice's notification copy is written to match that, and never
        # promises delivery while the app is closed.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.freixanet.alice.refresh
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The key is read back only for the user who put it there.
        NSFaceIDUsageDescription: >-
          Alice uses Face ID to unlock the app and your locked notes, when you
          turn that on in Settings.
        NSCameraUsageDescription: >-
          Alice uses the camera to scan a Hermes pairing QR code and when you
          attach a photo you take from the composer.
        NSMicrophoneUsageDescription: >-
          Alice uses the microphone when you dictate a message.
        NSSpeechRecognitionUsageDescription: >-
          Alice transcribes what you dictate so you can edit it before sending.
        # Local/private IPs and names use the explicit local-network exception.
        # Tailnet DNS names end in ts.net, while direct Tailscale IPv4 addresses
        # live in 100.64.0.0/10. Both need narrow HTTP exceptions; public Hermes
        # addresses are accepted only over HTTPS by HermesAddress.normalize.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
            "100.64.0.0/10":
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: >-
          Alice connects to the Hermes agent running on your network.
        # An agent at work, on the Lock Screen and in the Dynamic Island.
        # Updated only while Alice runs: no push (see AgentActivityAttributes).
        NSSupportsLiveActivities: true
    dependencies:
      - target: AliceActivities
        embed: true
      - target: AliceShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freixanet.alice
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        ALICE_SOURCE_REVISION: development
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Draws the agent Live Activity. It shares the activity's attributes and the
  # bot mark with the app, and nothing else.
  AliceActivities:
    type: app-extension
    platform: iOS
    sources:
      - path: AliceActivities
      - path: Alice/Shared/AgentActivity.swift
      - path: Alice/Models/BotMark.swift
      - path: Alice/DesignSystem/ColorHex.swift
      - path: Alice/Shared/BotPortraits.xcassets
    info:
      path: AliceActivities/Info.plist
      properties:
        CFBundleDisplayName: Alice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freixanet.alice.activities
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  # Hands a shared paragraph or link to Alice as a composer draft. It does
  # not talk to Hermes; Alice opens and the person sends it. NSExtension has
  # to live here: XcodeGen's Info.plist merge drops keys that are only in
  # the source file, and a share appex without that dictionary cannot be
  # installed on a simulator.
  AliceShare:
    type: app-extension
    platform: iOS
    sources:
      - path: AliceShare
    info:
      path: AliceShare/Info.plist
      properties:
        CFBundleDisplayName: Alice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freixanet.alice.share
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  AliceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AliceTests
    dependencies:
      - target: Alice
    settings:
      base:
        # The app target ships a hand-written Info.plist and turns generation
        # off for everything; a test bundle has nothing to say in one, so it
        # takes the generated version. Without this the target declared here
        # could never actually be built — which is why two sets of tests were
        # written against it and neither had ever run.
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.freixanet.alice.tests

  # Unit tests cover contracts; they cannot tell you whether a destination is
  # still reachable. The navigation these exercise was rearranged, so it needs
  # a check that actually drives the app.
  AliceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AliceUITests
    dependencies:
      - target: Alice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.freixanet.alice.uitests
        TEST_TARGET_NAME: Alice
