name: Alice
options:
  bundleIdPrefix: com.freixanet
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 2DYYWXP5XL

targets:
  Alice:
    type: application
    platform: iOS
    sources:
      - path: Alice
    info:
      path: Alice/Info.plist
      properties:
        CFBundleDisplayName: Alice
        # The pairing QR is an alice:// deep link; the scheme is what lets the
        # iPhone's own Camera app open Alice at the moment of pairing.
        CFBundleURLTypes:
          - CFBundleURLName: com.freixanet.alice.pairing
            CFBundleURLSchemes:
              - alice
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
        UILaunchScreen: {}
        # Opportunistic background catch-up. iOS decides whether and when this
        # runs; Alice's notification copy is written to match that, and never
        # promises delivery while the app is closed.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.freixanet.alice.refresh
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The key is read back only for the user who put it there.
        NSCameraUsageDescription: >-
          Alice uses the camera to scan a Hermes pairing QR code and when you
          attach a photo you take from the composer.
        NSMicrophoneUsageDescription: >-
          Alice uses the microphone when you dictate a message.
        NSSpeechRecognitionUsageDescription: >-
          Alice transcribes what you dictate so you can edit it before sending.
        NSFaceIDUsageDescription: >-
          Alice uses Face ID to unlock the connection key for your Hermes agent.
        # A Hermes on the local network is reached over plain HTTP; a hosted one
        # is HTTPS and unaffected by this exception.
        NSAppTransportSecurity:
          # A self-hosted Hermes usually answers over plain HTTP on an address
          # only its owner can reach — a LAN box, a tailnet peer, a machine on
          # the desk. `NSAllowsLocalNetworking` covers `.local` names and
          # link-local ranges, but not a tailnet address like 100.x, so every
          # such connection was refused before it left the phone and surfaced
          # as "couldn't reach that address".
          #
          # The app talks only to the address its user typed, and the key never
          # travels anywhere else, so the exception is scoped by intent rather
          # than by a list of hosts nobody can predict.
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: >-
          Alice connects to the Hermes agent running on your network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freixanet.alice
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  AliceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AliceTests
    dependencies:
      - target: Alice
    settings:
      base:
        # The app target ships a hand-written Info.plist and turns generation
        # off for everything; a test bundle has nothing to say in one, so it
        # takes the generated version. Without this the target declared here
        # could never actually be built — which is why two sets of tests were
        # written against it and neither had ever run.
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.freixanet.alice.tests
